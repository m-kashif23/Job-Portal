<header class="topbar">
  <a class="brand" routerLink="/admin" aria-label="Job Portal admin dashboard">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="13" rx="2"></rect>
        <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <path d="M3 12h18"></path>
        <path d="M10 12v2h4v-2"></path>
      </svg>
    </span>
    <span>Job Portal<span class="brand-subtitle">Admin console</span></span>
  </a>

  <nav aria-label="Admin navigation">
    <a routerLink="/admin" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
    <a routerLink="/managejob" routerLinkActive="active-link">Create job</a>
    <a routerLink="/edit" routerLinkActive="active-link">Manage jobs</a>
    <a routerLink="/adminapplication" routerLinkActive="active-link">Applications</a>
    <a routerLink="/payments" routerLinkActive="active-link">Payments</a>
    <a class="logout-link" (click)="logout()">Log out</a>
  </nav>
</header>
